# 安全响应头（公网 3000 与内网 3443 两个 vhost 共用）
# CSP 说明：script 的 sha256 锁的是 dist/index.html 里的内联 API-base 注入脚本
# （内容为空值回落同源，被挡也不影响功能）；img/media 放行 http: 是为了
# 内网 http 页面的对象存储直连播放不被 CSP 误伤。
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-FidGTtd4+lHlIFU88OAtkhSE5HnUoA0UdPTxGQtn5YM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
