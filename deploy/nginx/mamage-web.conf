server {
    listen 3000;
    server_name mamage.wenyuli.site MaMage.wenyuli.site;
    include /opt/homebrew/etc/nginx/security-headers.conf;
    include /opt/homebrew/etc/nginx/csp-public.conf;

    root /Users/liwenyu/mamage-web/dist;
    index index.html;


    # 内容哈希命名的 bundle：可永久缓存；缺失返回真 404（不再落回 index.html）


    # robots/security.txt 走短缓存：内容变更需及时生效，不能被边缘钉 7 天
    location = /robots.txt {
        include /opt/homebrew/etc/nginx/security-headers.conf;
        include /opt/homebrew/etc/nginx/csp-public.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # 常见管理后台/组件探测路径一律真 404（无扩展名的 SPA 回退不再兜住它们）
    location ~* ^/(actuator|manager/html|console|phpmyadmin|wp-admin|wp-login\.php|druid|solr|jenkins|swagger|api-docs)(/|$) {
        return 404;
    }
    location ~* ^/bundle\.[0-9a-f]+\.(js|css)$ {
        include /opt/homebrew/etc/nginx/security-headers.conf;
        include /opt/homebrew/etc/nginx/csp-public.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 其他静态资源：短缓存 + 真 404（防 SPA 回退把断图/robots 变成软 200）
    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|map|txt|xml|json)$ {
        include /opt/homebrew/etc/nginx/security-headers.conf;
        include /opt/homebrew/etc/nginx/csp-public.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }
    location / {
        include /opt/homebrew/etc/nginx/security-headers.conf;
        include /opt/homebrew/etc/nginx/csp-public.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/video-projects/assets {
        proxy_pass http://mamage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location ^~ /api/ai/video/ {
        proxy_pass http://mamage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location ^~ /api/image/ {
        proxy_pass http://mamage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /api/upload/ {
        proxy_pass http://mamage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/ {
        proxy_pass http://mamage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100g;
    }
}
