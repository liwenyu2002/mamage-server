server {
    listen 3443 ssl http2;
    server_name lan.mamage.wenyuli.site liwenyudemac-mini.local;
    include /opt/homebrew/etc/nginx/security-headers.conf;
    include /opt/homebrew/etc/nginx/csp-lan.conf;

    ssl_certificate /Users/liwenyu/.mamage-lan-https/fullchain.pem;
    ssl_certificate_key /Users/liwenyu/.mamage-lan-https/privkey.pem;
    ssl_session_cache shared:mamage_lan_ssl:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100g;

    location ^~ /api/video-projects/assets {
        proxy_pass http://mamage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location ^~ /api/ai/video/ {
        proxy_pass http://mamage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location ^~ /api/image/ {
        proxy_pass http://mamage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /api/upload/ {
        proxy_pass http://mamage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/ {
        proxy_pass http://mamage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    root /Users/liwenyu/mamage-web/dist;


    # 内容哈希命名的 bundle：可永久缓存；缺失返回真 404（不再落回 index.html）
    location ~* ^/bundle\.[0-9a-f]+\.(js|css)$ {
        include /opt/homebrew/etc/nginx/security-headers.conf;
        include /opt/homebrew/etc/nginx/csp-lan.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 其他静态资源：短缓存 + 真 404（防 SPA 回退把断图/robots 变成软 200）
    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|map|txt|xml|json)$ {
        include /opt/homebrew/etc/nginx/security-headers.conf;
        include /opt/homebrew/etc/nginx/csp-lan.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }
    location / {
        include /opt/homebrew/etc/nginx/security-headers.conf;
        include /opt/homebrew/etc/nginx/csp-lan.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
